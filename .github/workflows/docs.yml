# Builds the documentation site (docs/) and checks it: every C# excerpt must match
# the sample it quotes, and every local link must resolve. Pushes to master also
# publish it to GitHub Pages (enable Pages with "GitHub Actions" as the source).
#
# It also builds the samples' WebAssembly modules, which "Run it in your
# browser" runs in the page. bflat comes from the cache test.yml fills, under
# the same key; if this runs first, it builds bflat and fills the cache itself.
# It doesn't run the samples: test.yml does that.
name: Docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the fork's build restores packages from GitHub Packages

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp

      - name: Find the fork's current commit
        id: fork
        run: echo "key=bflat-layouts-$(git ls-remote https://github.com/OnurGumus/bflat refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore bflat from the cache
        id: bflat
        uses: actions/cache@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ steps.fork.outputs.key }}

      - name: Check out the fork
        if: steps.bflat.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: OnurGumus/bflat
          ref: master
          path: bflat

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build bflat
        if: steps.bflat.outputs.cache-hit != 'true'
        working-directory: bflat
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src/bflat
          dotnet nuget add source --username USERNAME --password "$PACKAGES_TOKEN" --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/bflattened/index.json"
          cd ../..
          dotnet build src/bflat/bflat.csproj -t:BuildLayouts -c:Release

      - name: Restore the WebAssembly tools
        id: wasm-tools
        uses: actions/cache@v4
        with:
          path: zero-csharp/tools/wasm
          key: wasm-tools-${{ hashFiles('zero-csharp/env.sh') }}

      - name: Install what bflat and the build need
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils

      - name: Download the WebAssembly tools
        if: steps.wasm-tools.outputs.cache-hit != 'true'
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./setup.sh --wasm

      - name: Build the samples for WebAssembly
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./build.sh --wasm

      - name: Set up Node.js for the search index
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore tools
        working-directory: zero-csharp
        run: dotnet tool restore

      - name: Build and check the site
        working-directory: zero-csharp
        run: python3 scripts/build-docs.py

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: zero-csharp/output

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
